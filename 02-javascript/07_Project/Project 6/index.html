<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard key project</title>
</head>
<body style="background-color: rgb(161, 149, 149);">
    <div class="project">
        <div id="insert">
            <div class = "key">Press the key and watch magic</div>

        </div>
    </div>
    <script>
            const insert = document.getElementById("insert")

            window.addEventListener('keydown',(e) => {
                insert.innerHTML = `
                <div class="color">
                    <div class = 'color'>
                    <table>
                        <tr>
                            <th>Key</th>
                            <th>Keycode</th>
                            <th>Code</th>
                        </tr>
                        <tr>
                            <td>${e.key}</td>
                            <td>${e.keyCode}</td>
                            <td>${e.code}</td>
                        </tr>
                    </table>

                </div>
                `
            })


    </script>
</body>
</html>
