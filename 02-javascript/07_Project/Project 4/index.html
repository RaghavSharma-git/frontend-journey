<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <style>
        body {
            background-color: #000000;
            color:aliceblue
        }
        .container{
            margin: auto;
            width: 70%;
            height: 50vh;
            background-color: #606060;

        }
        #wrapper{
            text-align: center;
        }
        .form{
            text-align: center;
        }
        #guess{
            font-size: 40px;
            
        }
        .resultParas{
            text-align: center;
        }
        .button{
            border-radius: 5px;
            padding: 3px;
            margin-top: 10px;
            font-size: 17px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="wrapper">
            <h1>Number guessing game</h1>
            <p>Try and guess a random number between 1 and 100.</p>
            <p>You have 10 attempts to guess the right number.</p>
        </div>
        </br>
            <form class="form">
                <lable for="guessField" id="guess">Guess a number</lable><br>
                <input type="text" id="guessField" class="guessField">
                <br>
                <input class="button" type="submit" id="subt" value="Submit guess " class="guessSubmit">
            </form>

            <div class="resultParas">
                <p> Previous Guesses: <span class = "guesses"></span></p>
                <p> Guesses Remaning: <span class = "lastResult"></span>10</p>
                <p class = "loworHi"></p>
            </div>
        </div>
    </div>
    </body>
    <script src="codewithraghav"></script>
</body>
</html>
