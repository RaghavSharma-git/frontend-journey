<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            /* vertical */
            align-items: center;
            /*horizontal */
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            height: 400px;
            width: 300px;
            background-color: aqua;
            color: #212121;
            gap: 15px;
            border-radius: 20px;
        }

        .img {
            /* height: 200px; */
            /* width: 200px; */
            border-radius: 50%;
            background-color: black;
            margin-bottom: 80px;
        }

        .img img {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            padding : 10px
            
        }
        .followers{
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: beige;
            height:40px; ;
            width: 150px;
            border-radius: 20px;
        }
    </style>
</head>

<body style="background-color: #212121; color:white;">
    <div class="box">
        <div class="img ">image</div>
        <div class="followers" style="margin-bottom: 70px;">Followers</div>
    </div>

</body>
<script>
    const requestUrl = 'https://api.github.com/users/hiteshchoudhary'
    const xhr = new XMLHttpRequest();
    xhr.open('GET', requestUrl)
    xhr.onreadystatechange = function () {
        console.log(xhr.readyState);
        if (xhr.readyState === 4) {
            const data = JSON.parse(this.responseText) // we got information from Api

            const imgDiv = document.querySelector('.img');
            const followersDiv = document.querySelector('.followers');

            imgDiv.innerHTML = `<img src = "${data.avatar_url}" alt="profile">`;
            followersDiv.innerHTML = `Followers: ${data.followers}`;
            // console.log(typeof data);

            // console.log(data.follower);



        }

    }
    xhr.send();
</script>

</html>
