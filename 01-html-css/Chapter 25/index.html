<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Design</title>
    <style>

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            
            box-sizing: content-box;
            border: 2px solid black;
            margin: 30px;
            padding: 4px;
            background-color: rgb(255, 197, 197);
            border-radius: 10px;
            box-shadow: 20px 20px 20px rgba(59, 47, 47, 0.786);
            height: 589px;
            width: 360px;
            margin-top: 100px;
            margin-left: 200px;
        }

        .box img {
            margin-left: 6px;
            border-radius: 15px;
            margin-bottom: 20px;
            width: 350px;
            margin-top: 3px;
            margin-right: 6px;
        }

        .box button {
            margin-left: 39%;
            border-radius: 30px;
            margin: top 8px;
            font-size: 13px;
            padding: 10px;
            background-color: rgb(193, 207, 249);
            color: royalblue;

        }

        .tag {
            background-color: rgb(255, 255, 255);
            padding: 5px;
            border-radius: 30px;
            margin-left: 6px;

        }

        .peragraph {
            margin-top: 5px;
            /* margin-bottom: 10px; */
            font-size: 18px;
            color: rgb(0, 0, 0);
            text-align: left;
            margin-left: 6px;
        }

        .heading {
            margin-left: 6px;

        }
    </style>
</head>

<body>
    <div class="box">
        <div class="img">
            <img src="https://imgs.search.brave.com/3AzMoNlP49jFBsUuaRnpZO2XiBN7SFuw87_0mVT_BFM/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9pLnBp/bmltZy5jb20vb3Jp/Z2luYWxzL2IxLzg3/LzZkL2IxODc2ZGJj/YzExMDM2MTM0NDIz/MmEyY2M0NzJmNDQ0/LmpwZw"
                height="300px" width="300px " alt="image">
        </div>
        <div class="capsule">
            <span class="tag">Nature</span>
            <span class="tag">Lake</span>


        </div>
        <div class="heading">
            <h1>Lorem ipsum dolor</h1>

        </div>
        <div class="peragraph">
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Vitae maxime natus eum similique ipsam
                repudiandae

                nostrum, reiciendis sit quas accusantium. Temporibus magnam illo voluptatem sint sunt eum debitis soluta
                ea!
        </div>


        </p>
        <div class="button"></div><button>Read More </button>

    </div>
</body>

</html>
