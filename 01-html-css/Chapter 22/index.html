<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS lists</title>
    <style>
        nav>ul>li {
            list-style: devanagari;
            list-style-type: "🐉";
            list-style-position: inside;
            background-color: yellowgreen;
            border: 2px solid black;
            /* outline: 2px solid black; */
            /* list-style-type: url("https://www.w3.org/Style/Examples/007/markers.svg#marker"); */
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>home</li>
            <li>about</li>
            <li>contact</li>
        </ul>
    </nav>
</body>
</html>
