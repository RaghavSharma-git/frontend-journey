<head>

    <title>Document</title>
    <style>
        /* The specificity of this is 1 */
        h1{
            color:brown

        /* The specificity of this is 10 */
        .yellow {
            color: yellow;

        /* The specificity of this is 10 */
        .cblue {
            color: blue;
        }
        /* The specificity of this is 10 */
        .cred {
            color: red;
            
        }

</head>
